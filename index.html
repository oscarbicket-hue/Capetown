<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oscar's Cape Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --teal:    #1A7A6E;
  --teal-dk: #0F5249;
  --teal-lt: #E6F4F1;
  --teal-ltr:#F0FAF8;
  --gold:    #B8822E;
  --gold-lt: #FDF4E7;
  --dark:    #111318;
  --mid:     #6B7280;
  --muted:   #9CA3AF;
  --border:  #ECEAE4;
  --bg:      #F4F1EC;
  --card-bg: #FFFFFF;
  --radius:  14px;
}

html { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--dark); -webkit-tap-highlight-color: transparent; }
body { min-height: 100vh; }

/* ── HEADER ─────────────────────────────────── */
header {
  background: var(--teal-dk);
  height: 58px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px;
  position: sticky; top: 0; z-index: 1000;
  box-shadow: 0 1px 0 rgba(255,255,255,.07), 0 4px 24px rgba(0,0,0,.28);
}
.h-left { display: flex; flex-direction: column; }
header h1 { font-family: 'Playfair Display', serif; font-size: 1.15rem; color: #fff; line-height: 1; letter-spacing: -.01em; }
header h1 em { color: #E8B96A; font-style: normal; }
.h-sub { font-size: .58rem; color: rgba(255,255,255,.45); letter-spacing: .1em; text-transform: uppercase; margin-top: 4px; }
.hbadge { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); color: rgba(255,255,255,.8); font-size: .65rem; padding: 5px 13px; border-radius: 20px; white-space: nowrap; letter-spacing: .02em; }

/* ── SHELL ───────────────────────────────────── */
/* Mobile: stack vertically, whole page scrolls */
#shell { display: flex; flex-direction: column; }

/* Desktop: side-by-side, map sticky right */
@media (min-width: 740px) {
  html, body { height: 100%; overflow: hidden; }
  #shell { flex-direction: row; height: calc(100vh - 58px); overflow: hidden; }
  #map-panel { flex: 1; height: auto !important; max-height: none !important; order: 2; }
  #list-panel {
    width: 400px; flex-shrink: 0; border-right: 1px solid var(--border); order: 1;
    overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  #list-panel::-webkit-scrollbar { width: 4px; }
  #list-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .sec-label { position: sticky; top: 0; z-index: 10; }
}

/* ── MAP PANEL ───────────────────────────────── */
#map-panel {
  width: 100%; height: 74vw; min-height: 310px; max-height: 480px;
  flex-shrink: 0; position: relative;
}
#map { width: 100%; height: 100%; }

/* ── LIST SECTION HEADER ─────────────────────── */
.sec-label {
  padding: 15px 14px 11px;
  border-bottom: 1px solid var(--border);
  font-size: .58rem; font-weight: 600; letter-spacing: .14em;
  text-transform: uppercase; color: var(--mid);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg);
}
.sec-hint { font-size: .6rem; color: var(--muted); letter-spacing: 0; text-transform: none; font-weight: 400; }
.places { padding: 12px 12px 110px; display: flex; flex-direction: column; gap: 11px; }

/* ── CARDS ────────────────────────────────────── */
.card {
  background: var(--card-bg);
  border-radius: var(--radius); overflow: hidden;
  cursor: pointer;
  border: 1.5px solid transparent;
  box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 18px rgba(0,0,0,.07);
  transition: box-shadow .2s, border-color .2s, transform .12s;
  opacity: 0; animation: cardIn .38s ease forwards;
  -webkit-user-select: none; user-select: none;
}
.card:active { transform: scale(0.987); }
@keyframes cardIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.card:nth-child(1){animation-delay:.05s} .card:nth-child(2){animation-delay:.10s}
.card:nth-child(3){animation-delay:.15s} .card:nth-child(4){animation-delay:.20s}
.card:nth-child(5){animation-delay:.25s} .card:nth-child(6){animation-delay:.30s}
.card:nth-child(7){animation-delay:.35s} .card:nth-child(8){animation-delay:.40s}
.card:nth-child(9){animation-delay:.45s} .card:nth-child(10){animation-delay:.50s}

.card.teal:hover        { border-color: rgba(26,122,110,.3); box-shadow: 0 4px 20px rgba(26,122,110,.1); }
.card.gold:hover        { border-color: rgba(184,130,46,.3);  box-shadow: 0 4px 20px rgba(184,130,46,.1); }
.card.teal.active { border-color: var(--teal); box-shadow: 0 2px 8px rgba(26,122,110,.12), 0 8px 32px rgba(26,122,110,.14); }
.card.gold.active { border-color: var(--gold); box-shadow: 0 2px 8px rgba(184,130,46,.12), 0 8px 32px rgba(184,130,46,.14); }

/* ── CARD PHOTO ──────────────────────────────── */
.cphoto {
  position: relative; height: 148px; overflow: hidden;
  background: linear-gradient(135deg, #d0cec9, #bfbdb8);
}
.cphoto img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  opacity: 0; transition: transform .5s ease, opacity .4s ease;
}
.cphoto img.loaded { opacity: 1; }
.card:hover .cphoto img,
.card.active .cphoto img { transform: scale(1.05); }
.cphoto-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.42) 0%, rgba(0,0,0,.05) 55%, transparent 100%);
}
.cphoto-badge {
  position: absolute; bottom: 10px; left: 12px;
  width: 28px; height: 28px; border-radius: 50%;
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: .78rem;
  box-shadow: 0 2px 10px rgba(0,0,0,.28);
}
.teal .cphoto-badge { color: var(--teal); }
.gold .cphoto-badge { color: var(--gold); }
.cphoto-emoji {
  position: absolute; top: 10px; right: 12px;
  font-size: 1.25rem; line-height: 1;
  filter: drop-shadow(0 1px 4px rgba(0,0,0,.3));
}

/* ── CARD BODY ───────────────────────────────── */
.ched { padding: 11px 14px 2px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.cname { font-weight: 600; font-size: .9rem; line-height: 1.3; color: var(--dark); }
.carea { font-size: .66rem; color: var(--mid); margin-top: 2px; letter-spacing: .02em; }

.cbody { padding: 8px 14px 14px; }
.ctags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 9px; }
.tag { font-size: .59rem; padding: 3px 9px; border-radius: 20px; font-weight: 500; letter-spacing: .03em; }
.teal .tag { background: var(--teal-lt); color: #0a3d36; }
.gold .tag { background: var(--gold-lt); color: #6b4010; }

.cdesc { font-size: .76rem; color: #555; line-height: 1.66; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card.active .cdesc { -webkit-line-clamp: unset; }

.cextra { display: none; margin-top: 12px; }
.card.active .cextra { display: block; }

.ctip { padding: 10px 12px; border-radius: 10px; font-size: .74rem; line-height: 1.62; margin-bottom: 12px; }
.teal .ctip { background: var(--teal-ltr); }
.gold .ctip { background: var(--gold-lt); }
.ctip-lbl { font-weight: 600; font-size: .59rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
.teal .ctip-lbl { color: var(--teal); }
.gold .ctip-lbl { color: var(--gold); }

.cinfo { display: flex; flex-direction: column; gap: 5px; }
.irow { display: flex; gap: 7px; align-items: flex-start; font-size: .71rem; color: var(--mid); line-height: 1.45; }
.iico { flex-shrink: 0; }
a.il { text-decoration: none; font-weight: 500; }
.teal a.il { color: var(--teal); }
.gold a.il { color: var(--gold); }
a.il:hover { text-decoration: underline; }

.cbtns { display: flex; gap: 8px; margin-top: 12px; }
.btn {
  flex: 1; padding: 9px 8px; border-radius: 10px; border: none;
  font-family: 'DM Sans', sans-serif; font-size: .72rem; font-weight: 500;
  cursor: pointer; text-decoration: none;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: opacity .15s, transform .1s;
}
.btn:hover { opacity: .82; }
.btn:active { transform: scale(.96); }
.btn-map { color: #fff; }
.teal .btn-map { background: var(--teal); }
.gold .btn-map { background: var(--gold); }
.btn-web { background: #EDEBE6; color: var(--dark); }

/* ── LEAFLET ─────────────────────────────────── */
.leaflet-container { font-family: 'DM Sans', sans-serif; }
.leaflet-control-attribution { font-size: 9px !important; }
.leaflet-popup-content-wrapper {
  border-radius: 12px !important;
  box-shadow: 0 8px 32px rgba(0,0,0,.2) !important;
  padding: 0 !important; overflow: hidden;
}
.leaflet-popup-content { margin: 0 !important; width: 240px !important; }
.leaflet-popup-tip-container { margin-top: -1px; }
.pop-head { padding: 11px 13px 9px; }
.pop-name { font-weight: 600; font-size: .86rem; color: #fff; line-height: 1.2; }
.pop-area { font-size: .7rem; color: rgba(255,255,255,.75); margin-top: 2px; }
.pop-body { padding: 9px 13px 11px; background: #fff; font-size: .73rem; color: #555; line-height: 1.5; }

/* ── FLOATING WIDGET ─────────────────────────── */
#gif-widget {
  position: fixed;
  bottom: max(20px, env(safe-area-inset-bottom, 20px)); right: 20px; z-index: 9999;
  width: 72px; height: 72px; border-radius: 50%; overflow: visible;
  cursor: pointer; transition: transform .2s, box-shadow .2s;
  animation: bob 2.8s ease-in-out infinite;
  -webkit-user-select: none; user-select: none;
}
#gif-widget-inner { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,.28); border: 3px solid #fff; }
#gif-widget:hover { transform: scale(1.14) !important; animation: none; }
#gif-widget:hover #gif-widget-inner { box-shadow: 0 7px 28px rgba(0,0,0,.38); }
#gif-widget:active { transform: scale(0.94) !important; animation: none; }
#gif-widget img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
#gif-widget-hint {
  position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
  font-size: .56rem; font-weight: 600; color: rgba(255,255,255,.75);
  background: rgba(15,82,73,.75); border-radius: 10px; padding: 2px 7px;
  white-space: nowrap; letter-spacing: .04em; pointer-events: none;
}
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

/* ── CONFETTI ────────────────────────────────── */
#confetti-overlay {
  position: fixed; inset: 0; z-index: 99998; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .3s;
}
#confetti-overlay.active { opacity: 1; }
#confetti-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#four-years-msg {
  position: relative; z-index: 1;
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.8rem, 8vw, 3rem); color: #fff; text-align: center;
  padding: 22px 36px; border-radius: 22px;
  background: rgba(15,82,73,.92); border: 3px solid #E8B96A;
  box-shadow: 0 12px 60px rgba(0,0,0,.45), 0 0 0 6px rgba(232,185,106,.15);
  opacity: 0; transform: scale(0.5) translateY(30px);
  transition: opacity .4s cubic-bezier(.34,1.56,.64,1), transform .4s cubic-bezier(.34,1.56,.64,1);
  line-height: 1.25; max-width: 90vw;
}
#four-years-msg.visible { opacity: 1; transform: scale(1) translateY(0); }
#four-years-msg small {
  display: block; font-family: 'DM Sans', sans-serif;
  font-size: clamp(.75rem, 3vw, .95rem); color: #E8B96A;
  margin-top: 8px; font-weight: 500;
}
</style>
</head>
<body>

  <div class="h-left">

  <span class="hbadge">10 Favourite Spots</span>

<div id="shell">

  <div id="list-panel">

</div>

map.zoomControl.setPosition('bottomright');

var markerMap = {};

PLACES.forEach(function(p) {
  var color = p.theme === 'teal' ? '#1A7A6E' : '#B8822E';
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="34" height="42" viewBox="0 0 34 42">'
    + '<defs><filter id="sh' + p.id + '" x="-40%" y="-40%" width="180%" height="180%">'
    + '<feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="rgba(0,0,0,0.35)"/>'
    + '</filter></defs>'
    + '<path d="M17 0C7.6 0 0 7.6 0 17c0 12.8 17 25 17 25S34 29.8 34 17C34 7.6 26.4 0 17 0z" fill="' + color + '" filter="url(#sh' + p.id + ')"/>'
    + '<circle cx="17" cy="16" r="8.5" fill="rgba(255,255,255,0.22)"/>'
    + '<text x="17" y="20.5" font-family="sans-serif" font-weight="700" font-size="11" fill="white" text-anchor="middle">' + p.id + '</text>'
    + '</svg>';

  var icon = L.divIcon({ className: '', html: svg, iconSize: [34, 42], iconAnchor: [17, 42], popupAnchor: [0, -44] });

  var popup = L.popup({ closeButton: true, maxWidth: 240 })
    .setContent(
      '<div class="pop-head" style="background:' + color + '">'
      + '<div class="pop-name">' + p.emoji + ' ' + p.name + '</div>'
      + '<div class="pop-area">' + p.area + '</div>'
      + '</div>'
      + '<div class="pop-body">' + p.tip + '</div>'
    );

  var marker = L.marker([p.lat, p.lng], { icon: icon }).addTo(map).bindPopup(popup);
  marker.on('click', function() { selectCard(p.id, false); });
  markerMap[p.id] = marker;
});

// CARDS
var container = document.getElementById('places');
var activeId = null;
var BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

PLACES.forEach(function(p) {
  var el = document.createElement('div');
  el.className = 'card ' + p.theme;
  el.dataset.id = p.id;

  var webRow = p.website
    ? '<div class="irow"><span class="iico">🔗</span><a href="' + p.website + '" target="_blank" rel="noopener" class="il">' + p.wLabel + '</a></div>'
    : '';
  var webBtn = p.website
    ? '<a href="' + p.website + '" target="_blank" rel="noopener" class="btn btn-web">🌐 Website</a>'
    : '';

  el.innerHTML =
    '<div class="cphoto">'
    +   '<img src="' + BLANK + '" alt="' + p.name + '" loading="lazy">'
    +   '<div class="cphoto-overlay"></div>'
    +   '<div class="cphoto-badge">' + p.id + '</div>'
    +   '<div class="cphoto-emoji">' + p.emoji + '</div>'
    + '</div>'
    + '<div class="ched">'
    +   '<div><div class="cname">' + p.name + '</div><div class="carea">' + p.area + '</div></div>'
    + '</div>'
    + '<div class="cbody">'
    +   '<div class="ctags">' + p.tags.map(function(t){ return '<span class="tag">' + t + '</span>'; }).join('') + '</div>'
    +   '<div class="cdesc">' + p.desc + '</div>'
    +   '<div class="cextra">'
    +     '<div class="ctip"><div class="ctip-lbl">Oscar\'s Tip</div>' + p.tip + '</div>'
    +     '<div class="cinfo">'
    +       '<div class="irow"><span class="iico">📍</span><span>' + p.address + '</span></div>'
    +       '<div class="irow"><span class="iico">🕐</span><span>' + p.hours + '</span></div>'
    +       '<div class="irow"><span class="iico">💰</span><span>' + p.price + '</span></div>'
    +       '<div class="irow"><span class="iico">📞</span><span>' + p.phone + '</span></div>'
    +       webRow
    +     '</div>'
    +     '<div class="cbtns">'
    +       '<a href="' + p.gmaps + '" target="_blank" rel="noopener" class="btn btn-map">📍 Open in Maps</a>'
    +       webBtn
    +     '</div>'

    + '</div>';

  el.addEventListener('click', function(e) {
    if (e.target.closest('a')) return;
    selectCard(p.id, true);
  });

  container.appendChild(el);
});

// Fetch accurate Wikipedia thumbnails for each place
PLACES.forEach(function(p) {
  if (!p.wikiTitle) return;
  var apiUrl = 'https://en.wikipedia.org/w/api.php?action=query&titles='
    + encodeURIComponent(p.wikiTitle)
    + '&prop=pageimages&format=json&pithumbsize=600&origin=*';
  fetch(apiUrl)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var pages = data.query && data.query.pages;
      if (!pages) return;
      var page = Object.values(pages)[0];
      if (!page || !page.thumbnail) return;
      var imgEl = document.querySelector('.card[data-id="' + p.id + '"] .cphoto img');
      if (!imgEl) return;
      var newImg = new Image();
      newImg.onload = function() {
        imgEl.src = newImg.src;
        imgEl.classList.add('loaded');
      };
      newImg.src = page.thumbnail.source;
    })
    .catch(function() {});
});

var isMobile = function() { return window.innerWidth < 740; };

function selectCard(id, panMap) {
  var el = document.querySelector('.card[data-id="' + id + '"]');
  var wasActive = el.classList.contains('active');
  document.querySelectorAll('.card').forEach(function(c) { c.classList.remove('active'); });

  if (!wasActive) {
    el.classList.add('active');
    setTimeout(function() {
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, isMobile() ? 60 : 0);
    activeId = id;
    var p = PLACES.find(function(x) { return x.id === id; });
    if (panMap) {
      var dur = isMobile() ? 0.45 : 1.0;
      map.flyTo([p.lat, p.lng], 14, { duration: dur });
      setTimeout(function() { markerMap[id].openPopup(); }, isMobile() ? 400 : 950);
    } else {
      setTimeout(function() { markerMap[id].openPopup(); }, 100);
    }
  } else {
    activeId = null;
    map.closePopup();
    map.flyTo([-34.08, 18.41], 11, { duration: isMobile() ? 0.4 : 1.0 });
  }
}

// ── Confetti & "4 More Years" ──────────────────────────────────────────────
(function() {
  var overlay   = document.getElementById('confetti-overlay');
  var canvas    = document.getElementById('confetti-canvas');
  var msg       = document.getElementById('four-years-msg');
  var widget    = document.getElementById('gif-widget');
  var ctx       = canvas.getContext('2d');
  var animId    = null;
  var hideTimer = null;

  var COLORS = ['#1A7A6E','#B8822E','#E8B96A','#ffffff','#f06585','#5ec8e5','#a8e063','#f9d56e'];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function makeParticle() {
    return {
      x:      Math.random() * canvas.width,
      y:      -10 - Math.random() * canvas.height * 0.3,
      w:      5 + Math.random() * 9,
      h:      6 + Math.random() * 10,
      color:  COLORS[Math.floor(Math.random() * COLORS.length)],
      speed:  2.5 + Math.random() * 4.5,
      drift:  (Math.random() - 0.5) * 1.8,
      angle:  Math.random() * Math.PI * 2,
      spin:   (Math.random() - 0.5) * 0.18,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.04 + Math.random() * 0.06
    };
  }

  function launch() {
    if (hideTimer) clearTimeout(hideTimer);
    if (animId)    cancelAnimationFrame(animId);

    resize();
    overlay.classList.add('active');
    requestAnimationFrame(function() { msg.classList.add('visible'); });

    var particles = [];
    for (var i = 0; i < 140; i++) particles.push(makeParticle());

    var startTime = Date.now();
    var totalDuration = 4200;
    var fadeDuration  = 800;

    function tick() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var elapsed = Date.now() - startTime;
      var remaining = totalDuration - elapsed;
      var alpha = remaining < fadeDuration ? remaining / fadeDuration : 1;
      ctx.globalAlpha = Math.max(0, alpha);

      particles.forEach(function(p) {
        p.y      += p.speed;
        p.x      += p.drift + Math.sin(p.wobble) * 0.8;
        p.angle  += p.spin;
        p.wobble += p.wobbleSpeed;
        if (p.y > canvas.height + 20 && elapsed < totalDuration - 1000) {
          p.x = Math.random() * canvas.width;
          p.y = -20;
        }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });

      ctx.globalAlpha = 1;
      if (elapsed < totalDuration) {
        animId = requestAnimationFrame(tick);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    animId = requestAnimationFrame(tick);
    hideTimer = setTimeout(function() {
      msg.classList.remove('visible');
      setTimeout(function() { overlay.classList.remove('active'); }, 400);
    }, totalDuration - fadeDuration);
  }

  widget.addEventListener('click', launch);
  widget.addEventListener('touchend', function(e) { e.preventDefault(); launch(); });
})();

}); // end DOMContentLoaded
</script>
